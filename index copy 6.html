<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GPS Location</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 420px;

        background: #ffffff;

        padding: 25px;

        border-radius: 20px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;

        margin: 0 0 20px;

        color: #111827;
      }

      .status {
        padding: 14px;

        background: #eff6ff;

        border-radius: 10px;

        text-align: center;

        color: #1d4ed8;

        font-size: 14px;

        margin-bottom: 18px;

        line-height: 1.5;
      }

      .box {
        background: #f8fafc;

        border: 1px solid #e5e7eb;

        padding: 15px;

        border-radius: 12px;

        margin-bottom: 12px;
      }

      .label {
        display: block;

        font-size: 13px;

        color: #64748b;

        margin-bottom: 6px;
      }

      .value {
        display: block;

        font-size: 16px;

        font-weight: bold;

        color: #111827;

        word-break: break-all;

        line-height: 1.5;
      }

      .map-btn,
      .copy-btn {
        display: none;

        width: 100%;

        border: none;

        padding: 15px;

        border-radius: 12px;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        margin-top: 12px;

        text-align: center;

        text-decoration: none;
      }

      .map-btn {
        background: #16a34a;
      }

      .map-btn:hover {
        background: #15803d;
      }

      .copy-btn {
        background: #111827;
      }

      .copy-btn:hover {
        background: #000000;
      }

      .small {
        text-align: center;

        color: #64748b;

        font-size: 12px;

        margin-top: 18px;

        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="card">
      ```
      <h2>📍 GPS Location</h2>

      <div id="status" class="status">📍 Location permission Allow karein...</div>

      <div class="box">
        <span class="label">Latitude</span>
        <span id="lat" class="value">---</span>
      </div>

      <div class="box">
        <span class="label">Longitude</span>
        <span id="lon" class="value">---</span>
      </div>

      <div class="box">
        <span class="label">GPS Accuracy</span>
        <span id="accuracy" class="value">---</span>
      </div>

      <div class="box">
        <span class="label">Best Reading</span>
        <span id="reading" class="value">---</span>
      </div>

      <div class="box">
        <span class="label">Google Maps URL</span>
        <span id="mapUrl" class="value">---</span>
      </div>

      <!-- GOOGLE MAPS -->

      <a id="mapBtn" class="map-btn" target="_blank" rel="noopener noreferrer"> 🗺️ Open Location in Google Maps </a>

      <!-- COPY -->

      <button id="copyBtn" class="copy-btn" type="button" onclick="copyLocation()">📋 Copy Google Maps URL</button>

      <div class="small">GPS accuracy device aur surroundings par depend karti hai. Outdoor area mein accuracy generally better hoti hai.</div>
      ```
    </div>

    <script>
      /* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL

   AAPKA CURRENT URL
========================================================= */

      const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycby_BxHYfoPGf0Hy-ssCBxVPhwzobxpjaFyUgxJV7qkgOMBfYq5dHhDzUp8lm0sfwsw2/exec";

      /* =========================================================
   GPS VARIABLES
========================================================= */

      let bestPosition = null;

      let watchId = null;

      let readings = 0;

      let sheetAlreadySaved = false;

      const MAX_READINGS = 10;

      /* =========================================================
   PAGE OPEN
========================================================= */

      window.addEventListener("load", function () {
        console.log("Page opened");

        startGPS();
      });

      /* =========================================================
   START GPS
========================================================= */

      function startGPS() {
        const status = document.getElementById("status");

        /* GPS SUPPORT */

        if (!navigator.geolocation) {
          status.innerHTML = "❌ Browser GPS support nahi karta.";

          return;
        }

        /* HTTPS CHECK */

        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          status.innerHTML = "⚠️ GPS ke liye HTTPS required hai.";

          return;
        }

        status.innerHTML = "📍 Location permission Allow karein...";

        /* =====================================================
     GPS WATCH
  ===================================================== */

        watchId = navigator.geolocation.watchPosition(
          function (position) {
            readings++;

            const accuracy = position.coords.accuracy;

            console.log("GPS Reading:", readings, "Accuracy:", accuracy);

            /*
          Sirf BEST accuracy wali
          location rakhenge.
        */

            if (bestPosition === null || accuracy < bestPosition.coords.accuracy) {
              bestPosition = position;

              showPosition(position);

              createMapURL(position);
            }

            /*
          Agar 20 meter ya usse better
          accuracy mil gayi to save.
        */

            if (accuracy <= 20) {
              finishGPS();

              return;
            }

            /*
          Maximum 10 readings.
        */

            if (readings >= MAX_READINGS) {
              finishGPS();

              return;
            }
          },

          function (error) {
            console.error("GPS ERROR:", error);

            if (error.code === 1) {
              status.innerHTML = "❌ Location permission denied.<br><br>" + "Browser settings mein Location Allow karein.";
            } else if (error.code === 2) {
              status.innerHTML = "❌ Location unavailable.<br><br>" + "Phone ki Location/GPS ON karein.";
            } else if (error.code === 3) {
              status.innerHTML = "❌ GPS timeout.<br><br>" + "Open area mein dobara try karein.";
            } else {
              status.innerHTML = "❌ GPS location nahi mil saki.";
            }
          },

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0,
          },
        );
      }

      /* =========================================================
   SHOW POSITION
========================================================= */

      function showPosition(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const accuracy = position.coords.accuracy;

        document.getElementById("lat").innerHTML = latitude.toFixed(8);

        document.getElementById("lon").innerHTML = longitude.toFixed(8);

        document.getElementById("accuracy").innerHTML = accuracy.toFixed(2) + " meters";

        document.getElementById("reading").innerHTML = readings + " / " + MAX_READINGS;

        const status = document.getElementById("status");

        if (accuracy <= 10) {
          status.innerHTML = "✅ Excellent GPS accuracy: " + accuracy.toFixed(2) + " meters";
        } else if (accuracy <= 30) {
          status.innerHTML = "✅ Good GPS accuracy: " + accuracy.toFixed(2) + " meters";
        } else {
          status.innerHTML = "📍 Location found. Accuracy: " + accuracy.toFixed(2) + " meters";
        }
      }

      /* =========================================================
   GOOGLE MAP URL
========================================================= */

      function createMapURL(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const url = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        document.getElementById("mapUrl").innerHTML = url;

        const mapBtn = document.getElementById("mapBtn");

        mapBtn.href = url;

        mapBtn.style.display = "block";
      }

      /* =========================================================
   FINISH GPS
========================================================= */

      function finishGPS() {
        /* STOP GPS */

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);

          watchId = null;
        }

        if (!bestPosition) {
          document.getElementById("status").innerHTML = "❌ Location not found.";

          return;
        }

        /*
    Best location
  */

        showPosition(bestPosition);

        createMapURL(bestPosition);

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const accuracy = bestPosition.coords.accuracy;

        const mapsURL = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        document.getElementById("status").innerHTML = "📤 Location save ho rahi hai...";

        /*
    ================================================
    AUTOMATIC GOOGLE SHEET SAVE
    ================================================
  */

        if (!sheetAlreadySaved) {
          saveToGoogleSheet(latitude, longitude, accuracy, mapsURL);
        }
      }

      /* =========================================================
   AUTOMATIC GOOGLE SHEET SAVE

   PAGE OPEN → GPS → BEST LOCATION → AUTO SAVE
========================================================= */

      function saveToGoogleSheet(latitude, longitude, accuracy, mapsURL) {
        if (sheetAlreadySaved) {
          return;
        }

        sheetAlreadySaved = true;

        const dateTime = new Date().toLocaleString("en-IN");

        /*
    IMPORTANT:

    Apps Script mein ye names hone chahiye:

    dateTime
    latitude
    longitude
    accuracy
    mapsUrl
  */

        const data = {
          dateTime: dateTime,

          latitude: latitude.toFixed(8),

          longitude: longitude.toFixed(8),

          accuracy: accuracy.toFixed(2),

          mapsUrl: mapsURL,
        };

        console.log("Sending Google Sheet Data:", data);

        /*
    POST REQUEST
  */

        fetch(GOOGLE_SHEET_API, {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },

          body: JSON.stringify(data),
        })
          .then(function () {
            console.log("✅ Google Sheet data request sent");

            document.getElementById("status").innerHTML = "✅ Location saved successfully";
          })

          .catch(function (error) {
            console.error("❌ Google Sheet Error:", error);

            sheetAlreadySaved = false;

            document.getElementById("status").innerHTML = "⚠️ Location mil gayi. Sheet connection check karein.";
          });
      }

      /* =========================================================
   COPY LOCATION
========================================================= */

      function copyLocation() {
        if (!bestPosition) {
          alert("❌ Location available nahi hai.");

          return;
        }

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const url = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(url)

            .then(function () {
              const button = document.getElementById("copyBtn");

              button.innerHTML = "✅ URL Copied!";

              setTimeout(function () {
                button.innerHTML = "📋 Copy Google Maps URL";
              }, 2000);
            })

            .catch(function () {
              fallbackCopy(url);
            });
        }
      }

      /* =========================================================
   FALLBACK COPY
========================================================= */

      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";

        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.select();

        try {
          document.execCommand("copy");

          const button = document.getElementById("copyBtn");

          button.innerHTML = "✅ URL Copied!";

          setTimeout(function () {
            button.innerHTML = "📋 Copy Google Maps URL";
          }, 2000);
        } catch (error) {
          alert("Google Maps URL:\n\n" + text);
        }

        document.body.removeChild(textarea);
      }
    </script>
  </body>
</html>
