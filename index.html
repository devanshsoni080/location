<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GPS Location</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 430px;

        background: #fff;

        padding: 25px;

        border-radius: 20px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;

        margin: 0 0 25px;

        color: #111827;
      }

      .status {
        padding: 14px;

        background: #eff6ff;

        border-radius: 10px;

        text-align: center;

        color: #1d4ed8;

        font-size: 14px;

        margin-bottom: 18px;

        line-height: 1.5;
      }

      .loading {
        text-align: center;

        margin: 20px 0;
      }

      .loader {
        width: 40px;
        height: 40px;

        border: 4px solid #e5e7eb;

        border-top: 4px solid #2563eb;

        border-radius: 50%;

        animation: spin 1s linear infinite;

        margin: 0 auto 12px;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .box {
        background: #f8fafc;

        border: 1px solid #e5e7eb;

        padding: 15px;

        border-radius: 12px;

        margin-bottom: 12px;
      }

      .label {
        display: block;

        font-size: 13px;

        color: #64748b;

        margin-bottom: 6px;
      }

      .value {
        display: block;

        font-size: 16px;

        font-weight: bold;

        color: #111827;

        word-break: break-all;

        line-height: 1.5;
      }

      .map {
        display: none;

        width: 100%;

        text-align: center;

        text-decoration: none;

        padding: 14px;

        border-radius: 12px;

        background: #16a34a;

        color: white;

        font-weight: bold;

        margin-top: 12px;
      }

      .save {
        display: none;

        width: 100%;

        border: none;

        padding: 15px;

        border-radius: 12px;

        background: #2563eb;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        margin-top: 12px;
      }

      .save:hover {
        background: #1d4ed8;
      }

      .save:disabled {
        background: #94a3b8;

        cursor: not-allowed;
      }

      .copy {
        display: none;

        width: 100%;

        border: none;

        padding: 15px;

        border-radius: 12px;

        background: #111827;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        margin-top: 12px;
      }

      .result {
        display: none;

        padding: 14px;

        margin-top: 12px;

        border-radius: 10px;

        text-align: center;

        font-size: 14px;

        font-weight: bold;

        line-height: 1.5;
      }

      .small {
        text-align: center;

        color: #64748b;

        font-size: 12px;

        margin-top: 18px;

        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>📍 GPS Location</h2>

      <div id="status" class="status">📡 GPS location searching...</div>

      <div id="loading" class="loading">
        <div class="loader"></div>

        <div>Searching for GPS location...</div>
      </div>

      <!-- LATITUDE -->

      <div class="box">
        <span class="label"> Latitude </span>

        <span class="value" id="lat"> --- </span>
      </div>

      <!-- LONGITUDE -->

      <div class="box">
        <span class="label"> Longitude </span>

        <span class="value" id="lon"> --- </span>
      </div>

      <!-- ACCURACY -->

      <div class="box">
        <span class="label"> GPS Accuracy </span>

        <span class="value" id="accuracy"> --- </span>
      </div>

      <!-- READING -->

      <div class="box">
        <span class="label"> Best Reading </span>

        <span class="value" id="reading"> --- </span>
      </div>

      <!-- GOOGLE MAP -->

      <div class="box">
        <span class="label"> Google Maps URL </span>

        <span class="value" id="mapUrl"> --- </span>
      </div>

      <!-- GOOGLE MAP BUTTON -->

      <a id="map" class="map" target="_blank" rel="noopener noreferrer"> 🗺️ Open Location in Google Maps </a>

      <!-- SAVE BUTTON -->

      <button id="saveBtn" class="save" type="button" onclick="saveDataToSheet()">💾 Save Data to Google Sheet</button>

      <!-- COPY BUTTON -->

      <button id="copyBtn" class="copy" type="button" onclick="copyLocation()">📋 Copy Google Maps URL</button>

      <!-- SAVE RESULT -->

      <div id="result" class="result"></div>

      <div class="small">GPS accuracy depends on your device and surroundings. Outdoor GPS generally provides better accuracy.</div>
    </div>

    <script>
      /* =====================================================
     GOOGLE APPS SCRIPT WEB APP URL
  ====================================================== */

      const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbyuUYVvnS_VML5crdt1z8car_UT1u2e65Lp-WhY6qlPJqiHvwXDAkWJrhXC4SFNOrSX/exec";

      /* =====================================================
     GPS SETTINGS
  ====================================================== */

      let bestPosition = null;

      let watchId = null;

      let readings = 0;

      let dataSaved = false;

      const MAX_READINGS = 10;

      const MIN_ACCURACY = 10;

      /* =====================================================
     START GPS AUTOMATICALLY
  ====================================================== */

      window.addEventListener("load", function () {
        console.log("Page loaded");

        getHighAccuracyLocation();
      });

      /* =====================================================
     GET GPS LOCATION
  ====================================================== */

      function getHighAccuracyLocation() {
        const status = document.getElementById("status");

        const loading = document.getElementById("loading");

        const saveBtn = document.getElementById("saveBtn");

        const copyBtn = document.getElementById("copyBtn");

        const map = document.getElementById("map");

        /* RESET */

        bestPosition = null;

        readings = 0;

        dataSaved = false;

        document.getElementById("lat").innerHTML = "---";

        document.getElementById("lon").innerHTML = "---";

        document.getElementById("accuracy").innerHTML = "---";

        document.getElementById("reading").innerHTML = "---";

        document.getElementById("mapUrl").innerHTML = "---";

        loading.style.display = "block";

        saveBtn.style.display = "none";

        copyBtn.style.display = "none";

        map.style.display = "none";

        /* RESULT RESET */

        const result = document.getElementById("result");

        result.style.display = "none";

        result.innerHTML = "";

        /* =================================================
       CHECK GPS
    ================================================= */

        if (!navigator.geolocation) {
          loading.style.display = "none";

          status.innerHTML = "❌ Browser GPS support nahi karta.";

          return;
        }

        /* =================================================
       HTTPS CHECK
    ================================================= */

        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          loading.style.display = "none";

          status.innerHTML = "⚠️ Location ke liye HTTPS ya localhost required hai.";

          return;
        }

        status.innerHTML = "📡 GPS permission request ho rahi hai...";

        /* =================================================
       START GPS WATCH
    ================================================= */

        watchId = navigator.geolocation.watchPosition(
          function (position) {
            readings++;

            const currentAccuracy = position.coords.accuracy;

            console.log("GPS Reading:", readings, "Accuracy:", currentAccuracy);

            /* =================================================
             BEST LOCATION
          ================================================= */

            if (bestPosition === null || currentAccuracy < bestPosition.coords.accuracy) {
              bestPosition = position;

              showPosition(position);

              createGoogleMapsURL(position);

              status.innerHTML = "📍 Location found. Accuracy improve ho rahi hai...";
            }

            /* =================================================
             EXCELLENT ACCURACY
          ================================================= */

            if (currentAccuracy <= MIN_ACCURACY) {
              finishLocation();

              return;
            }

            /* =================================================
             MAX READINGS
          ================================================= */

            if (readings >= MAX_READINGS) {
              finishLocation();

              return;
            }
          },

          function (error) {
            loading.style.display = "none";

            console.error("GPS ERROR:", error);

            if (error.code === 1) {
              status.innerHTML = "❌ Location permission denied.<br><br>" + "Chrome me Location → Allow karo.";
            } else if (error.code === 2) {
              status.innerHTML = "❌ Location unavailable.<br><br>" + "Phone ki GPS/Location service ON karo.";
            } else if (error.code === 3) {
              status.innerHTML = "❌ GPS timeout.<br><br>" + "Open area me dobara try karo.";
            } else {
              status.innerHTML = "❌ GPS location nahi mil saki.";
            }
          },

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0,
          },
        );
      }

      /* =====================================================
     SHOW POSITION
  ====================================================== */

      function showPosition(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const accuracy = position.coords.accuracy;

        document.getElementById("lat").innerHTML = latitude.toFixed(8);

        document.getElementById("lon").innerHTML = longitude.toFixed(8);

        document.getElementById("accuracy").innerHTML = accuracy.toFixed(2) + " meters";

        document.getElementById("reading").innerHTML = readings + " / " + MAX_READINGS;

        console.log("Latitude:", latitude);

        console.log("Longitude:", longitude);

        console.log("Accuracy:", accuracy);
      }

      /* =====================================================
     GOOGLE MAPS URL
  ====================================================== */

      function createGoogleMapsURL(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const url = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        document.getElementById("mapUrl").innerHTML = url;

        const map = document.getElementById("map");

        map.href = url;

        map.style.display = "block";
      }

      /* =====================================================
     FINISH GPS
  ====================================================== */

      function finishLocation() {
        /* STOP GPS */

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);

          watchId = null;
        }

        const loading = document.getElementById("loading");

        const status = document.getElementById("status");

        const saveBtn = document.getElementById("saveBtn");

        const copyBtn = document.getElementById("copyBtn");

        loading.style.display = "none";

        /* CHECK LOCATION */

        if (!bestPosition) {
          status.innerHTML = "❌ Location not found.";

          return;
        }

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const accuracy = bestPosition.coords.accuracy;

        const mapsURL = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        /* SHOW FINAL DATA */

        document.getElementById("lat").innerHTML = latitude.toFixed(8);

        document.getElementById("lon").innerHTML = longitude.toFixed(8);

        document.getElementById("accuracy").innerHTML = accuracy.toFixed(2) + " meters";

        document.getElementById("mapUrl").innerHTML = mapsURL;

        const map = document.getElementById("map");

        map.href = mapsURL;

        map.style.display = "block";

        /* =================================================
       SHOW SAVE BUTTON
    ================================================= */

        saveBtn.style.display = "block";

        /* COPY BUTTON */

        copyBtn.style.display = "block";

        /* STATUS */

        if (accuracy <= 10) {
          status.innerHTML = "✅ Excellent accuracy: " + accuracy.toFixed(2) + " meters";
        } else if (accuracy <= 30) {
          status.innerHTML = "✅ Good accuracy: " + accuracy.toFixed(2) + " meters";
        } else {
          status.innerHTML = "⚠️ Location found. Accuracy: " + accuracy.toFixed(2) + " meters";
        }

        console.log("========== FINAL LOCATION ==========");

        console.log("Latitude:", latitude);

        console.log("Longitude:", longitude);

        console.log("Accuracy:", accuracy);

        console.log("Maps:", mapsURL);

        /*
      IMPORTANT:

      Yahan email automatically SEND nahi hogi.

      Sirf Save button click par
      Google Sheet API call hogi.
    */
      }

      /* =====================================================
     SAVE DATA TO GOOGLE SHEET
  ====================================================== */

      async function saveDataToSheet() {
        /* CHECK LOCATION */

        if (!bestPosition) {
          alert("❌ Pehle GPS location milne do.");

          return;
        }

        /* DUPLICATE CHECK */

        if (dataSaved) {
          alert("✅ Data already saved.");

          return;
        }

        const saveBtn = document.getElementById("saveBtn");

        const result = document.getElementById("result");

        /* GET DATA */

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const accuracy = bestPosition.coords.accuracy;

        const mapsURL = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        const dateTime = new Date().toLocaleString("en-IN", {
          dateStyle: "medium",
          timeStyle: "medium",
        });

        /* =================================================
       BUTTON LOADING
    ================================================= */

        saveBtn.disabled = true;

        saveBtn.innerHTML = "⏳ Saving Data...";

        result.style.display = "block";

        result.style.background = "#fff7ed";

        result.style.color = "#c2410c";

        result.innerHTML = "📤 Google Sheet me data save ho raha hai...";

        /* =================================================
       DATA FOR APPS SCRIPT
    ================================================= */

        const data = {
          dateTime: dateTime,

          latitude: latitude.toFixed(8),

          longitude: longitude.toFixed(8),

          accuracy: accuracy.toFixed(2),

          mapsUrl: mapsURL,
        };

        console.log("Sending Sheet Data:", data);

        /* =================================================
       API CALL
    ================================================= */

        try {
          const response = await fetch(GOOGLE_SHEET_API, {
            method: "POST",

            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },

            body: JSON.stringify(data),
          });

          const text = await response.text();

          console.log("Apps Script Response:", text);

          /* =================================================
         SUCCESS
      ================================================= */

          dataSaved = true;

          result.style.background = "#f0fdf4";

          result.style.color = "#15803d";

          result.innerHTML = "✅ <b>Data successfully saved!</b><br>" + "<small>" + "Google Sheet me location add ho gayi." + "</small>";

          saveBtn.innerHTML = "✅ Data Saved";
        } catch (error) {
          /* =================================================
       ERROR
    ================================================= */

          console.error("Google Sheet Error:", error);

          result.style.background = "#fef2f2";

          result.style.color = "#dc2626";

          result.innerHTML = "❌ <b>Data save nahi hua.</b><br>" + "<small>" + "Apps Script Web App / deployment check karo." + "</small>";

          saveBtn.disabled = false;

          saveBtn.innerHTML = "💾 Save Data to Google Sheet";
        }
      }

      /* =====================================================
     COPY GOOGLE MAP URL
  ====================================================== */

      function copyLocation() {
        if (!bestPosition) {
          alert("Location available nahi hai.");

          return;
        }

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const url = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(url)

            .then(function () {
              const button = document.getElementById("copyBtn");

              button.innerHTML = "✅ Google Maps URL Copied!";

              setTimeout(function () {
                button.innerHTML = "📋 Copy Google Maps URL";
              }, 2000);
            })

            .catch(function () {
              fallbackCopy(url);
            });
        } else {
          fallbackCopy(url);
        }
      }

      /* =====================================================
     FALLBACK COPY
  ====================================================== */

      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";

        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.select();

        try {
          document.execCommand("copy");

          const button = document.getElementById("copyBtn");

          button.innerHTML = "✅ Google Maps URL Copied!";

          setTimeout(function () {
            button.innerHTML = "📋 Copy Google Maps URL";
          }, 2000);
        } catch (error) {
          alert("Google Maps URL:\n\n" + text);
        }

        document.body.removeChild(textarea);
      }
    </script>
  </body>
</html>
