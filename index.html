<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Automatic GPS Location</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;

        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, sans-serif;

        background: #f3f4f6;
      }

      .card {
        width: 100%;
        max-width: 420px;

        background: #ffffff;

        padding: 25px;

        border-radius: 20px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }

      h2 {
        margin: 0 0 20px;

        text-align: center;

        color: #111827;
      }

      .status {
        padding: 14px;

        border-radius: 10px;

        background: #eff6ff;

        color: #1d4ed8;

        text-align: center;

        font-size: 14px;

        line-height: 1.5;

        margin-bottom: 18px;
      }

      .loading {
        text-align: center;

        margin: 20px 0;
      }

      .loader {
        width: 40px;
        height: 40px;

        margin: 0 auto 12px;

        border: 4px solid #e5e7eb;

        border-top-color: #2563eb;

        border-radius: 50%;

        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .box {
        margin-bottom: 12px;

        padding: 15px;

        background: #f8fafc;

        border: 1px solid #e5e7eb;

        border-radius: 12px;
      }

      .label {
        display: block;

        margin-bottom: 6px;

        color: #64748b;

        font-size: 13px;
      }

      .value {
        display: block;

        color: #111827;

        font-size: 16px;

        font-weight: bold;

        line-height: 1.5;

        word-break: break-all;
      }

      .map {
        display: none;

        width: 100%;

        margin-top: 12px;

        padding: 14px;

        border-radius: 12px;

        background: #16a34a;

        color: #ffffff;

        text-align: center;

        text-decoration: none;

        font-weight: bold;
      }

      .sheet-status {
        display: none;

        margin-top: 12px;

        padding: 14px;

        border-radius: 10px;

        text-align: center;

        font-size: 13px;

        font-weight: bold;

        line-height: 1.5;
      }

      .small {
        margin-top: 18px;

        color: #64748b;

        text-align: center;

        font-size: 12px;

        line-height: 1.5;
      }

      /* Hidden form used for Google Apps Script */

      #sheetForm {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>📍 Automatic GPS Location</h2>

      <div id="status" class="status">Starting GPS...</div>

      <div id="loading" class="loading">
        <div class="loader"></div>

        <div>Searching for GPS location...</div>
      </div>

      <div class="box">
        <span class="label"> Latitude </span>

        <span id="lat" class="value"> --- </span>
      </div>

      <div class="box">
        <span class="label"> Longitude </span>

        <span id="lon" class="value"> --- </span>
      </div>

      <div class="box">
        <span class="label"> GPS Accuracy </span>

        <span id="accuracy" class="value"> --- </span>
      </div>

      <div class="box">
        <span class="label"> Best Reading </span>

        <span id="reading" class="value"> --- </span>
      </div>

      <div class="box">
        <span class="label"> Google Maps URL </span>

        <span id="mapUrl" class="value"> --- </span>
      </div>

      <a id="map" class="map" target="_blank" rel="noopener noreferrer"> 🗺️ Open Location in Google Maps </a>

      <div id="sheetStatus" class="sheet-status"></div>

      <!--
      Hidden form.
      This sends the data directly to Apps Script.
    -->

      <form id="sheetForm" method="POST" target="sheetFrame">
        <input type="hidden" name="dateTime" id="formDateTime" />

        <input type="hidden" name="latitude" id="formLatitude" />

        <input type="hidden" name="longitude" id="formLongitude" />

        <input type="hidden" name="accuracy" id="formAccuracy" />

        <input type="hidden" name="mapsUrl" id="formMapsUrl" />
      </form>

      <iframe name="sheetFrame" id="sheetFrame" style="display: none"></iframe>

      <div class="small">GPS location milte hi data automatically Google Sheet me save hoga.</div>
    </div>

    <script>
      /* =====================================================
     YOUR GOOGLE APPS SCRIPT WEB APP
  ===================================================== */

      const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycby_BxHYfoPGf0Hy-ssCBxVPhwzobxpjaFyUgxJV7qkgOMBfYq5dHhDzUp8lm0sfwsw2/exec";

      /* =====================================================
     GPS SETTINGS
  ===================================================== */

      let bestPosition = null;

      let watchId = null;

      let readings = 0;

      let dataSaved = false;

      const MAX_READINGS = 10;

      const MIN_ACCURACY = 10;

      /* =====================================================
     PAGE OPEN
  ===================================================== */

      window.addEventListener("load", function () {
        console.log("GPS page loaded");

        startGPS();
      });

      /* =====================================================
     START GPS
  ===================================================== */

      function startGPS() {
        const status = document.getElementById("status");

        const loading = document.getElementById("loading");

        if (!navigator.geolocation) {
          loading.style.display = "none";

          status.innerHTML = "❌ Browser GPS support nahi karta.";

          return;
        }

        /*
      HTTPS CHECK
    */

        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          loading.style.display = "none";

          status.innerHTML = "⚠️ GPS ke liye HTTPS required hai.";

          return;
        }

        status.innerHTML = "📡 Location permission maangi ja rahi hai...";

        /*
      START GPS WATCH
    */

        watchId = navigator.geolocation.watchPosition(
          function (position) {
            readings++;

            const accuracy = position.coords.accuracy;

            console.log("GPS reading:", readings, "Accuracy:", accuracy);

            /*
            BEST LOCATION SELECT
          */

            if (bestPosition === null || accuracy < bestPosition.coords.accuracy) {
              bestPosition = position;

              showLocation(position);

              status.innerHTML = "📍 Location mil gayi. Accuracy improve ho rahi hai...";
            }

            /*
            EXCELLENT ACCURACY
          */

            if (accuracy <= MIN_ACCURACY) {
              finishGPS();

              return;
            }

            /*
            MAX READINGS
          */

            if (readings >= MAX_READINGS) {
              finishGPS();

              return;
            }
          },

          function (error) {
            loading.style.display = "none";

            console.error("GPS ERROR:", error);

            if (error.code === 1) {
              status.innerHTML = "❌ Location permission denied.<br><br>" + "Browser me Location Allow karo.";
            } else if (error.code === 2) {
              status.innerHTML = "❌ Location unavailable.<br><br>" + "Phone ki Location ON karo.";
            } else if (error.code === 3) {
              status.innerHTML = "❌ GPS timeout.<br><br>" + "Open area me try karo.";
            } else {
              status.innerHTML = "❌ GPS location nahi mil saki.";
            }
          },

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0,
          },
        );
      }

      /* =====================================================
     SHOW LOCATION
  ===================================================== */

      function showLocation(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const accuracy = position.coords.accuracy;

        document.getElementById("lat").innerHTML = latitude.toFixed(8);

        document.getElementById("lon").innerHTML = longitude.toFixed(8);

        document.getElementById("accuracy").innerHTML = accuracy.toFixed(2) + " meters";

        document.getElementById("reading").innerHTML = readings + " / " + MAX_READINGS;

        const mapsURL = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        document.getElementById("mapUrl").innerHTML = mapsURL;

        const map = document.getElementById("map");

        map.href = mapsURL;

        map.style.display = "block";
      }

      /* =====================================================
     FINISH GPS
  ===================================================== */

      function finishGPS() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);

          watchId = null;
        }

        const loading = document.getElementById("loading");

        const status = document.getElementById("status");

        loading.style.display = "none";

        if (!bestPosition) {
          status.innerHTML = "❌ Location nahi mili.";

          return;
        }

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const accuracy = bestPosition.coords.accuracy;

        const mapsURL = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        if (accuracy <= 10) {
          status.innerHTML = "✅ Excellent accuracy: " + accuracy.toFixed(2) + " meters";
        } else if (accuracy <= 30) {
          status.innerHTML = "✅ Good accuracy: " + accuracy.toFixed(2) + " meters";
        } else {
          status.innerHTML = "⚠️ Location found: " + accuracy.toFixed(2) + " meters";
        }

        /*
      AUTOMATICALLY SAVE
    */

        saveToSheet(latitude, longitude, accuracy, mapsURL);
      }

      /* =====================================================
     SAVE TO GOOGLE SHEET
  ===================================================== */

      function saveToSheet(latitude, longitude, accuracy, mapsURL) {
        if (dataSaved) {
          return;
        }

        dataSaved = true;

        const sheetStatus = document.getElementById("sheetStatus");

        sheetStatus.style.display = "block";

        sheetStatus.style.background = "#eff6ff";

        sheetStatus.style.color = "#1d4ed8";

        sheetStatus.innerHTML = "📤 Google Sheet me data save ho raha hai...";

        /*
      DATE/TIME
    */

        const dateTime = new Date().toLocaleString("en-IN");

        /*
      PUT DATA IN FORM
    */

        document.getElementById("formDateTime").value = dateTime;

        document.getElementById("formLatitude").value = latitude.toFixed(8);

        document.getElementById("formLongitude").value = longitude.toFixed(8);

        document.getElementById("formAccuracy").value = accuracy.toFixed(2);

        document.getElementById("formMapsUrl").value = mapsURL;

        /*
      SET FORM ACTION
    */

        const form = document.getElementById("sheetForm");

        form.action = GOOGLE_SHEET_API;

        /*
      SUBMIT TO APPS SCRIPT
    */

        console.log("Sending data to Google Sheet...");

        console.log({
          dateTime: dateTime,
          latitude: latitude,
          longitude: longitude,
          accuracy: accuracy,
          mapsUrl: mapsURL,
        });

        form.submit();

        /*
      SHOW SUCCESS AFTER REQUEST
    */

        setTimeout(function () {
          sheetStatus.style.background = "#f0fdf4";

          sheetStatus.style.color = "#15803d";

          sheetStatus.innerHTML = "✅ <b>Data Google Sheet ko send kar diya gaya.</b>";
        }, 1500);
      }
    </script>
  </body>
</html>
