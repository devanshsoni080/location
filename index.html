<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GPS Location</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 420px;

        background: #ffffff;

        padding: 25px;

        border-radius: 20px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;
        margin: 0 0 20px;
        color: #111827;
      }

      .status {
        padding: 14px;

        background: #eff6ff;

        border-radius: 10px;

        text-align: center;

        color: #1d4ed8;

        font-size: 14px;

        margin-bottom: 18px;

        line-height: 1.5;
      }

      .box {
        background: #f8fafc;

        border: 1px solid #e5e7eb;

        padding: 15px;

        border-radius: 12px;

        margin-bottom: 12px;
      }

      .label {
        display: block;

        font-size: 13px;

        color: #64748b;

        margin-bottom: 6px;
      }

      .value {
        display: block;

        font-size: 16px;

        font-weight: bold;

        color: #111827;

        word-break: break-all;

        line-height: 1.5;
      }

      .map-btn,
      .copy-btn {
        display: none;

        width: 100%;

        border: none;

        padding: 15px;

        border-radius: 12px;

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        margin-top: 12px;

        text-align: center;

        text-decoration: none;
      }

      .map-btn {
        background: #16a34a;
      }

      .map-btn:hover {
        background: #15803d;
      }

      .copy-btn {
        background: #111827;
      }

      .copy-btn:hover {
        background: #000000;
      }

      .sheet-status {
        display: none;

        padding: 14px;

        margin-top: 12px;

        border-radius: 10px;

        text-align: center;

        font-size: 13px;

        font-weight: bold;

        line-height: 1.5;
      }

      .small {
        text-align: center;

        color: #64748b;

        font-size: 12px;

        margin-top: 18px;

        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>📍 GPS Location</h2>

      <div id="status" class="status">📡 Location permission required...</div>

      <!-- LATITUDE -->

      <div class="box">
        <span class="label">Latitude</span>
        <span id="lat" class="value">---</span>
      </div>

      <!-- LONGITUDE -->

      <div class="box">
        <span class="label">Longitude</span>
        <span id="lon" class="value">---</span>
      </div>

      <!-- ACCURACY -->

      <div class="box">
        <span class="label">GPS Accuracy</span>
        <span id="accuracy" class="value">---</span>
      </div>

      <!-- READING -->

      <div class="box">
        <span class="label">Best Reading</span>
        <span id="reading" class="value">---</span>
      </div>

      <!-- MAP URL -->

      <div class="box">
        <span class="label">Google Maps URL</span>
        <span id="mapUrl" class="value">---</span>
      </div>

      <!-- GOOGLE MAPS BUTTON -->

      <a id="mapBtn" class="map-btn" target="_blank" rel="noopener noreferrer"> 🗺️ Open Location in Google Maps </a>

      <!-- GOOGLE SHEET STATUS -->

      <div id="sheetStatus" class="sheet-status"></div>

      <!-- COPY BUTTON -->

      <button id="copyBtn" class="copy-btn" type="button" onclick="copyLocation()">📋 Copy Google Maps URL</button>

      <div class="small">GPS accuracy device aur surroundings par depend karti hai. Outdoor area mein accuracy generally better hoti hai.</div>
    </div>

    <script>
      /* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================================= */

      const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycby_BxHYfoPGf0Hy-ssCBxVPhwzobxpjaFyUgxJV7qkgOMBfYq5dHhDzUp8lm0sfwsw2/exec";

      /* =========================================================
   GPS VARIABLES
========================================================= */

      let bestPosition = null;

      let watchId = null;

      let readings = 0;

      let sheetAlreadySaved = false;

      let autoSaveStarted = false;

      /* =========================================================
   GPS SETTINGS
========================================================= */

      const MAX_READINGS = 10;

      /* =========================================================
   PAGE LOAD
========================================================= */

      window.addEventListener("load", function () {
        console.log("🚀 Page loaded");

        startGPS();
      });

      /* =========================================================
   START GPS
========================================================= */

      function startGPS() {
        const status = document.getElementById("status");

        /* GPS SUPPORT CHECK */

        if (!navigator.geolocation) {
          status.innerHTML = "❌ Browser GPS support nahi karta.";

          return;
        }

        /* HTTPS CHECK */

        if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          status.innerHTML = "⚠️ GPS ke liye HTTPS ya localhost required hai.";

          return;
        }

        status.innerHTML = "📍 Location permission Allow karein...";

        /* =====================================================
     WATCH GPS
  ===================================================== */

        watchId = navigator.geolocation.watchPosition(
          function (position) {
            readings++;

            const accuracy = position.coords.accuracy;

            console.log("📡 GPS Reading:", readings, "Accuracy:", accuracy);

            /* =================================================
         BEST ACCURACY LOCATION
      ================================================= */

            if (bestPosition === null || accuracy < bestPosition.coords.accuracy) {
              bestPosition = position;

              showPosition(position);

              createMapURL(position);

              showButtons();

              /* =============================================
           1 SECOND TIMER
           
           LOCATION MILNE KE BAAD
           1 SECOND WAIT
           PHIR SAVE
        ============================================= */

              if (!autoSaveStarted) {
                autoSaveStarted = true;

                console.log("⏳ 1 second timer started...");

                status.innerHTML = "📍 Location found. Saving in 1 second...";

                setTimeout(function () {
                  console.log("⏰ Timer complete.");

                  saveToGoogleSheet();
                }, 1000);
              }
            }

            /* =================================================
         MAX READINGS
      ================================================= */

            if (readings >= MAX_READINGS) {
              finishGPS();
            }
          },

          /* =====================================================
       GPS ERROR
    ===================================================== */

          function (error) {
            console.error("❌ GPS ERROR:", error);

            if (error.code === 1) {
              status.innerHTML = "❌ Location permission denied.<br><br>" + "Browser settings mein Location Allow karein.";
            } else if (error.code === 2) {
              status.innerHTML = "❌ Location unavailable.<br><br>" + "Phone ki Location/GPS ON karein.";
            } else if (error.code === 3) {
              status.innerHTML = "❌ GPS timeout.<br><br>" + "Open area mein dobara try karein.";
            } else {
              status.innerHTML = "❌ GPS location nahi mil saki.";
            }
          },

          /* =====================================================
       GPS OPTIONS
    ===================================================== */

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0,
          },
        );
      }

      /* =========================================================
   SHOW POSITION
========================================================= */

      function showPosition(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const accuracy = position.coords.accuracy;

        document.getElementById("lat").innerHTML = latitude.toFixed(8);

        document.getElementById("lon").innerHTML = longitude.toFixed(8);

        document.getElementById("accuracy").innerHTML = accuracy.toFixed(2) + " meters";

        document.getElementById("reading").innerHTML = readings + " / " + MAX_READINGS;

        const status = document.getElementById("status");

        if (accuracy <= 10) {
          status.innerHTML = "✅ Excellent GPS accuracy: " + accuracy.toFixed(2) + " meters";
        } else if (accuracy <= 30) {
          status.innerHTML = "✅ Good GPS accuracy: " + accuracy.toFixed(2) + " meters";
        } else {
          status.innerHTML = "📍 Location found. Accuracy: " + accuracy.toFixed(2) + " meters";
        }
      }

      /* =========================================================
   GOOGLE MAP URL
========================================================= */

      function createMapURL(position) {
        const latitude = position.coords.latitude;

        const longitude = position.coords.longitude;

        const url = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        document.getElementById("mapUrl").innerHTML = url;

        const mapBtn = document.getElementById("mapBtn");

        mapBtn.href = url;

        mapBtn.style.display = "block";
      }

      /* =========================================================
   SHOW BUTTONS
========================================================= */

      function showButtons() {
        document.getElementById("mapBtn").style.display = "block";

        document.getElementById("copyBtn").style.display = "block";
      }

      /* =========================================================
   FINISH GPS
========================================================= */

      function finishGPS() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);

          watchId = null;
        }

        if (bestPosition) {
          showPosition(bestPosition);

          createMapURL(bestPosition);

          showButtons();
        }
      }

      /* =========================================================
   SAVE TO GOOGLE SHEET
   AUTOMATIC FUNCTION
========================================================= */

      function saveToGoogleSheet() {
        /* LOCATION CHECK */

        if (!bestPosition) {
          console.log("❌ Location available nahi hai.");

          return;
        }

        /* DUPLICATE CHECK */

        if (sheetAlreadySaved) {
          console.log("⚠️ Data already saved.");

          return;
        }

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const accuracy = bestPosition.coords.accuracy;

        const mapsURL = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        const dateTime = new Date().toLocaleString("en-IN");

        /* =====================================================
     DATA
  ===================================================== */

        const data = {
          dateTime: dateTime,

          latitude: latitude.toFixed(8),

          longitude: longitude.toFixed(8),

          accuracy: accuracy.toFixed(2),

          mapsUrl: mapsURL,
        };

        console.log("📤 Sending Google Sheet Data:", data);

        const sheetStatus = document.getElementById("sheetStatus");

        sheetStatus.style.display = "block";

        sheetStatus.style.background = "#eff6ff";

        sheetStatus.style.color = "#1d4ed8";

        sheetStatus.innerHTML = "📤 Google Sheet mein data save ho raha hai...";

        /* =====================================================
     API REQUEST
  ===================================================== */

        fetch(
          GOOGLE_SHEET_API,

          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },

            body: JSON.stringify(data),
          },
        )
          .then(function () {
            sheetAlreadySaved = true;

            sheetStatus.style.background = "#f0fdf4";

            sheetStatus.style.color = "#15803d";

            sheetStatus.innerHTML =
              "✅ <b>Location saved to Google Sheet!</b><br>" +
              "<small>" +
              "Date/Time, Latitude, Longitude, Accuracy aur Maps URL save kiya gaya." +
              "</small>";

            console.log("✅ Google Sheet request sent successfully.");
          })

          .catch(function (error) {
            console.error("❌ Google Sheet Error:", error);

            sheetStatus.style.background = "#fef2f2";

            sheetStatus.style.color = "#dc2626";

            sheetStatus.innerHTML = "❌ Google Sheet request failed.";
          });
      }

      /* =========================================================
   COPY GOOGLE MAPS URL
========================================================= */

      function copyLocation() {
        if (!bestPosition) {
          alert("❌ Location available nahi hai.");

          return;
        }

        const latitude = bestPosition.coords.latitude;

        const longitude = bestPosition.coords.longitude;

        const url = "https://www.google.com/maps?q=" + latitude + "," + longitude;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(url)

            .then(function () {
              const button = document.getElementById("copyBtn");

              button.innerHTML = "✅ URL Copied!";

              setTimeout(function () {
                button.innerHTML = "📋 Copy Google Maps URL";
              }, 2000);
            })

            .catch(function () {
              fallbackCopy(url);
            });
        } else {
          fallbackCopy(url);
        }
      }

      /* =========================================================
   FALLBACK COPY
========================================================= */

      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";

        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.select();

        try {
          document.execCommand("copy");

          const button = document.getElementById("copyBtn");

          button.innerHTML = "✅ URL Copied!";

          setTimeout(function () {
            button.innerHTML = "📋 Copy Google Maps URL";
          }, 2000);
        } catch (error) {
          alert("Google Maps URL:\n\n" + text);
        }

        document.body.removeChild(textarea);
      }
    </script>
  </body>
</html>
